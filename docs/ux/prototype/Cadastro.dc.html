<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criar uma conta</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="rme-tokens.css">
<link rel="stylesheet" href="ds/frameworkrme/components/bundle.css">
<link rel="stylesheet" href="rme-app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&amp;family=IBM+Plex+Sans:wght@300;400;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--link);text-decoration:none}a:hover{color:var(--link-hover);text-decoration:underline}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 100%; background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: 14px; line-height: 20px; letter-spacing: 0.16px; display: flex; flex-direction: column">
<main style="flex: 1; display: grid; place-items: center; padding: 48px 16px">
<form style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 24px">
<a href="Inicio.dc.html" aria-label="Voltar à página inicial" style="align-self: flex-start"><img src="/_blob/29f7ae5980b254ec1a4a65cbd84e590c" alt="Framework RME" style="width: 48px; height: 48px; display: block"></a>
<div>
<h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 400">Criar uma conta</h1>
<p class="muted" style="margin: 4px 0 0">Digite seus dados abaixo para criar sua conta.</p>
</div>
<div><label class="rme-label" for="nome">Nome</label><input id="nome" class="rme-field" placeholder="Nome completo"></div>
<div><label class="rme-label" for="email">Endereço de e-mail</label><input id="email" type="email" class="rme-field" placeholder="email@example.com"></div>
<div><label class="rme-label" for="senha">Senha</label><input id="senha" type="password" class="rme-field" placeholder="Senha"></div>
<div><label class="rme-label" for="conf">Confirmar senha</label><input id="conf" type="password" class="rme-field" placeholder="Confirmar senha"></div>
<a class="rme-btn rme-btn--primary rme-btn--lg" href="Verificar-email.dc.html" style="color: var(--primary-foreground); width: 100%; box-sizing: border-box">Criar conta <svg class="rme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></a>
<p style="margin: 0">Já tem uma conta? <a href="Login.dc.html">Entrar</a></p>
</form>
</main>
<footer style="padding: 24px; border-top: 1px solid var(--border)"><p class="rme-caption" style="margin: 0; text-align: center">Framework RME · Projeto de pesquisa aplicada — PUCPR</p></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'light' };
}
}
</script>
</body>
</html>
