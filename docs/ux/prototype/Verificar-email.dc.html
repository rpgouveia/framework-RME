<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Verificação de e-mail</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="rme-tokens.css">
<link rel="stylesheet" href="ds/frameworkrme/components/bundle.css">
<link rel="stylesheet" href="rme-app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&amp;family=IBM+Plex+Sans:wght@300;400;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--link);text-decoration:none}a:hover{color:var(--link-hover);text-decoration:underline}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 100%; background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: 14px; line-height: 20px; letter-spacing: 0.16px; display: flex; flex-direction: column">
<main style="flex: 1; display: grid; place-items: center; padding: 48px 16px">
<div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 24px">
<span style="display: inline-grid; place-items: center; width: 48px; height: 48px; background: var(--muted)"><svg class="rme-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px"><rect x="3" y="5" width="18" height="14"></rect><path d="m3 7 9 6 9-6"></path></svg></span>
<div>
<h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 400">Verificação de e-mail</h1>
<p class="muted" style="margin: 4px 0 0">Verifique seu endereço de e-mail clicando no link que acabamos de enviar para você.</p>
</div>
<div class="rme-alert rme-alert--success">
<svg class="rme-alert-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
<div><p class="rme-alert-text" style="margin: 0">Um novo link de verificação foi enviado para o endereço de e-mail informado no cadastro.</p></div>
</div>
<button class="rme-btn rme-btn--primary rme-btn--lg" style="width: 100%">Reenviar o e-mail de verificação</button>
<a href="Inicio.dc.html">Sair</a>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":920}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'light' };
}
}
</script>
</body>
</html>
